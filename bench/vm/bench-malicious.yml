# TEMPLATE — do not move this into .github/workflows of the public repo.
#
# Copy it to .github/workflows/bench-malicious.yml in a PRIVATE repo
# (e.g. rathinadev/repotrap-bench) whose only self-hosted runner lives on the
# isolated VM. Reasons:
#   - A self-hosted runner attached to a public repo can be reached by workflow
#     files added in pull requests from forks.
#   - The malicious corpus and its manifest stay on the VM; only the redacted
#     scorecard is uploaded.
#
# VM layout expected by this workflow (see bench/README.md):
#   /srv/repotrap-corpus/malicious.jsonl          entries with "path" into /srv/repotrap-corpus/samples
#   /srv/repotrap-corpus/technique-copies.jsonl   harmless technique copies
#   /srv/repotrap-corpus/baseline/scorecard.json  previous accepted scorecard (optional)

name: bench-malicious

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "repotrap git ref to benchmark"
        default: "main"
      cutoff:
        description: "Time-split cutoff date (YYYY-MM-DD), optional"
        default: ""

permissions:
  contents: read

jobs:
  bench:
    runs-on: [self-hosted, repotrap-bench-vm]
    timeout-minutes: 240
    steps:
      - name: Check out repotrap (public)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rathinadev/repotrap
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build scanner
        run: |
          npm ci
          npm run build

      - name: Run malicious benchmark (read-only scan, redacted output)
        env:
          CORPUS_DIR: /srv/repotrap-corpus
          CUTOFF: ${{ inputs.cutoff }}
        run: |
          set -- --manifest "$CORPUS_DIR/malicious.jsonl" --manifest "$CORPUS_DIR/technique-copies.jsonl"
          if [ -n "$CUTOFF" ]; then set -- "$@" --cutoff "$CUTOFF"; fi
          node bench/run-bench.ts "$@" \
            --scanner node --scanner-arg packages/cli/dist/repotrap.js --scanner-arg scan --scanner-arg=--no-metadata \
            --baseline "$CORPUS_DIR/baseline/scorecard.json" \
            --min-detection 0.8 \
            --redact \
            --out "$RUNNER_TEMP/bench-results"

      - name: Upload redacted scorecard only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: malicious-scorecard
          path: |
            ${{ runner.temp }}/bench-results/scorecard.json
            ${{ runner.temp }}/bench-results/scorecard.md
          if-no-files-found: ignore
          retention-days: 30
